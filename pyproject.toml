[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secpipeline"
version = "0.1.0"
description = "Small CI-oriented security checks + local knowledge helper"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.32.0",
  "httpx>=0.28.0",
  "pyyaml>=6.0",
]

[project.scripts]
secpipeline = "secpipeline.cli:main"

[tool.setuptools.packages.find]
include = ["secpipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
